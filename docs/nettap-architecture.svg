  <text x="-100" y="-332" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="28" fill="#1e1e1e" text-anchor="start">
    <tspan x="-100" dy="0">nettap — high-level architecture</tspan>
  </text>
  <text x="-100" y="-302" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start">
    <tspan x="-100" dy="0">capture Docker container traffic → raw pcaps → SQLite flows → reports</tspan>
  </text>
  <text x="550" y="-144" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle">
    <tspan x="550" dy="0">Operator</tspan>
    <tspan x="550" dy="20">runs  nettap &lt;command&gt;</tspan>
  </text>
  <text x="550" y="36" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#1971c2" text-anchor="middle">
    <tspan x="550" dy="0">cli.py</tspan>
    <tspan x="550" dy="20">watch · sidecar · attach</tspan>
    <tspan x="550" dy="20">detach · status · enrich</tspan>
    <tspan x="550" dy="20">analyze · report</tspan>
  </text>
  <text x="970" y="246" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle">
    <tspan x="970" dy="0">hostports.py</tspan>
    <tspan x="970" dy="20">--network host targets:</tspan>
    <tspan x="970" dy="20">which ports they own</tspan>
  </text>
  <text x="130" y="446" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle">
    <tspan x="130" dy="0">Docker daemon</tspan>
    <tspan x="130" dy="20">docker.sock API</tspan>
    <tspan x="130" dy="20">/var/run/docker/netns</tspan>
  </text>
  <text x="550" y="436" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle">
    <tspan x="550" dy="0">controller.py</tspan>
    <tspan x="550" dy="20">reconcile loop, every 5s</tspan>
    <tspan x="550" dy="20">desired vs live →</tspan>
    <tspan x="550" dy="20">attach / detach</tspan>
  </text>
  <text x="550" y="636" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle">
    <tspan x="550" dy="0">discovery.py</tspan>
    <tspan x="550" dy="20">finds the interface:</tspan>
    <tspan x="550" dy="20">host-side veth, or the</tspan>
    <tspan x="550" dy="20">container's own netns</tspan>
  </text>
  <text x="550" y="836" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#7048e8" text-anchor="middle">
    <tspan x="550" dy="0">capture.py</tspan>
    <tspan x="550" dy="20">tcpdump per container</tspan>
    <tspan x="550" dy="20">+ DNS on lo (127.0.0.11)</tspan>
    <tspan x="550" dy="20">restart dead · retention</tspan>
  </text>
  <text x="970" y="836" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="middle">
    <tspan x="970" dy="0">data/pcap/</tspan>
    <tspan x="970" dy="20">&lt;name&gt;_&lt;ts&gt;.pcap</tspan>
    <tspan x="970" dy="20">&lt;name&gt;_&lt;ts&gt;.dns.pcap</tspan>
    <tspan x="970" dy="20">(open in Wireshark)</tspan>
  </text>
  <text x="1390" y="836" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#f08c00" text-anchor="middle">
    <tspan x="1390" dy="0">enrich.py</tspan>
    <tspan x="1390" dy="20">background thread</tspan>
    <tspan x="1390" dy="20">tshark → flow rows</tspan>
    <tspan x="1390" dy="20">IPs · bytes · DNS · SNI</tspan>
  </text>
  <text x="550" y="1046" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle">
    <tspan x="550" dy="0">Target containers</tspan>
    <tspan x="550" dy="20">label monitor=true</tspan>
    <tspan x="550" dy="20">or attached by name</tspan>
  </text>
  <text x="1870" y="386" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="middle">
    <tspan x="1870" dy="0">storage.py</tspan>
    <tspan x="1870" dy="20">SQLite</tspan>
    <tspan x="1870" dy="20"></tspan>
    <tspan x="1870" dy="20">containers</tspan>
    <tspan x="1870" dy="20">flows</tspan>
    <tspan x="1870" dy="20">owned_ports</tspan>
    <tspan x="1870" dy="20">desired_refs</tspan>
    <tspan x="1870" dy="20">desired_labels</tspan>
    <tspan x="1870" dy="20">live_sessions</tspan>
  </text>
  <text x="2310" y="336" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#1971c2" text-anchor="middle">
    <tspan x="2310" dy="0">analyze.py</tspan>
    <tspan x="2310" dy="20">top-talkers · matrix</tspan>
    <tspan x="2310" dy="20">dns · external · protocols</tspan>
    <tspan x="2310" dy="20">JSON or table</tspan>
  </text>
  <text x="2310" y="606" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#1971c2" text-anchor="middle">
    <tspan x="2310" dy="0">report.py</tspan>
    <tspan x="2310" dy="20">plain-language summary</tspan>
    <tspan x="2310" dy="20">terminal text or HTML</tspan>
  </text>
  <text x="2730" y="476" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle">
    <tspan x="2730" dy="0">Reader</tspan>
    <tspan x="2730" dy="20">engineer or</tspan>
    <tspan x="2730" dy="20">non-technical</tspan>
  </text>
  <text x="562" y="-36" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start">
    <tspan x="562" dy="0">runs</tspan>
  </text>
  <text x="720" y="30" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start">
    <tspan x="720" dy="0">attach / detach  →  desired state</tspan>
  </text>
  <text x="984" y="144" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start">
    <tspan x="984" dy="0">--network host targets</tspan>
  </text>
  <text x="1140" y="250" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start">
    <tspan x="1140" dy="0">owned_ports (when each port was in use)</tspan>
  </text>
  <text x="612" y="264" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start">
    <tspan x="612" dy="0">watch mode</tspan>
  </text>
  <text x="280" y="432" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start">
    <tspan x="280" dy="0">containers</tspan>
    <tspan x="280" dy="17.5">+ labels</tspan>
  </text>
  <text x="720" y="450" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start">
    <tspan x="720" dy="0">reads desired state  ·  writes live_sessions</tspan>
  </text>
  <text x="562" y="562" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start">
    <tspan x="562" dy="0">1. which interface?</tspan>
  </text>
  <text x="562" y="762" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start">
    <tspan x="562" dy="0">2. run tcpdump on it</tspan>
  </text>
  <text x="-80" y="804" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start">
    <tspan x="-80" dy="0">sidecar mode: joins the target's</tspan>
    <tspan x="-80" dy="17.5">network, captures its eth0 directly</tspan>
  </text>
  <text x="562" y="962" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start">
    <tspan x="562" dy="0">packets</tspan>
  </text>
  <text x="692" y="850" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start">
    <tspan x="692" dy="0">write, rotate 60s</tspan>
  </text>
  <text x="1112" y="850" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start">
    <tspan x="1112" dy="0">finished pcaps</tspan>
  </text>
  <text x="1540" y="850" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start">
    <tspan x="1540" dy="0">flow rows</tspan>
  </text>
  <text x="2040" y="350" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start">
    <tspan x="2040" dy="0">queries</tspan>
  </text>
  <text x="2040" y="610" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start">
    <tspan x="2040" dy="0">queries</tspan>
  </text>
  <text x="2460" y="350" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start">
    <tspan x="2460" dy="0">JSON / table</tspan>
  </text>
  <text x="2460" y="642" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="start">
    <tspan x="2460" dy="0">text / HTML</tspan>
  </text>
</svg>