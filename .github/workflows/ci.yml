name: CI

on:
  push:
  pull_request:

# Pinned to 24.04: setup-python only ships Python 3.9 builds for 22.04/24.04.
jobs:
  unit:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.x"]   # oldest supported and newest release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # one enrich test runs the real tshark and is skipped without it
      - name: Install tshark
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tshark
      - run: pip install -e ".[dev]"
      - run: pytest -v

  # the same build release.yml publishes, so packaging breaks show up
  # before a release tag
  package:
    name: build and check the package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-venv/bin/nettap --version

  # tests/live: discovery.resolve_capture() against real bridge, macvlan,
  # ipvlan and multi-network containers. nsenter needs root.
  live:
    name: live discovery tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install -e ".[dev]"
      - run: sudo "$(which python)" -m pytest -m live tests/live -v -rs

  integration:
    name: integration (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [sidecar, watch, sidecars]
    steps:
      - uses: actions/checkout@v7
      - run: docker version
      - run: bash scripts/integration_test.sh --mode ${{ matrix.mode }} --no-internet

  # how many connections sidecar --attribute-by-port catches for a
  # --network host target (the numbers quoted in the README)
  accuracy:
    name: host-network port attribution accuracy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/hostports_accuracy.sh
