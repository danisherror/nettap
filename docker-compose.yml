services:
  nettap:
    build: .
    container_name: nettap
    restart: unless-stopped
    # Needs to see host-side veth interfaces created by dockerd for *other*
    # containers - those live in the host's root network namespace, which a
    # normally-networked container never sees. Hence host networking here,
    # traded off against NOT needing --privileged or --pid=host (see
    # nettap/discovery.py for why those aren't required).
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # rslave: without it, netns files of containers started after nettap
      # show up as empty files and nsenter fails with "Invalid argument".
      # Linux hosts only - Docker Desktop doesn't support mount propagation.
      # https://docs.docker.com/engine/storage/bind-mounts/#configure-bind-propagation
      - /var/run/docker/netns:/var/run/docker/netns:ro,rslave
      - ./data:/data
    command: ["watch", "--label", "monitor=true"]
    # Swap for ["watch", "--all"] to capture every running container by
    # default, or keep the label selector and add ad-hoc targets from
    # another shell with: docker compose exec nettap nettap --data-dir /data attach <name>
